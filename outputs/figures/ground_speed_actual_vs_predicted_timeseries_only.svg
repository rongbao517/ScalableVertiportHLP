<text x="20" y="30" font-size="20" font-weight="650" fill="#0b0b0b">Ground-Speed Forecast — Actual vs. Predicted (held-out test set)</text>
<text x="20" y="50" font-size="12.5" fill="#52514e">GRU speed model used to build the 48-bucket (hour_of_day, day_type) lookup that feeds access/egress time in the inner-loop route assignment.</text>
<text x="20" y="68" font-size="12.5" fill="#52514e">30-day dataset, chronological split: 24 train days / 3 validation / 3 test. Shown here: the 3 held-out test days the model never saw during training.</text>
